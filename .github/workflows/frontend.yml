name: Frontend quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install actual Home Assistant browser runtime
        run: python -m pip install -r ../requirements_test.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run check:bundle
      - name: Verify committed bundle is reproducible
        run: git diff --exit-code -- ../custom_components/nascar_race_center/frontend/
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser rendering and accessibility
        env:
          CHROMIUM_PATH: bundled
          NRC_BROWSERS: webkit,firefox,chromium
        run: npm run test:browser -- --max-failures=1
      - name: Retain actual-card screenshots and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5c-browser-validation
          path: |
            docs/screenshots/phase5c/
            frontend/test-results/
          retention-days: 14
