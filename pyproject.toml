[project]
name = "ha-nascar-race-center"
version = "0.2.1"
description = "NASCAR Race Center Home Assistant custom integration"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
files = ["custom_components/nascar_race_center"]

[[tool.mypy.overrides]]
module = ["voluptuous.*"]
ignore_missing_imports = true
